# Builds the static site and publishes it to GitHub Pages on every push to main.
#
# This enables GitHub Pages itself on the first run. If that is blocked by an
# organisation policy, set it by hand: Settings → Pages → Build and deployment →
# Source: "GitHub Actions", then re-run this workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken parser or scoring rule should stop the deploy, not reach the phone.
      - run: npm test

      - run: npm run build
        env:
          # A project site is served from /<repo>. Derived so renaming the
          # repository does not silently break every asset URL.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # enablement turns Pages on for the repository if it is not already,
      # so the first deploy does not fail on a setting nobody remembered.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
